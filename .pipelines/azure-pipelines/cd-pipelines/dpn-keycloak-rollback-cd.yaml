trigger: none

parameters:

  - name: ServiceConnection
    displayName: 'ServiceConnection details'
    type: string
    default: 'sc-dpn-dev-001'
    values:
      - sc-dpn-dev-001
      - sc-dpn-dev-002
      - sc-dpn-test-001
      - sc-dpn-test-002
      - sc-dpn-pdev-ppd-001
      - sc-dpn-ptest-ppd-001
      - sc-dpn-puat-ppd-001

  - name: environment
    displayName: Environment Name
    type: string
    default: 'dev'
    values:
      - dev
      - devtest
      - test
      - pdev
      - ptest
      - puat

  - name: dpnCluster
    displayName: "Target DPN Cluster (pdev/ptest/puat have only one DPN — dpn02 is disabled for those environments)"
    type: string
    default: dpn01
    values:
      - dpn01
      - dpn02

  - name: revision
    displayName: "Target Helm revision (0 = previous stable release)"
    type: string
    default: '0'

variables:
  - name: RELEASE_NAME
    value: "dpn-keycloak"

  - name: KEYCLOAK_FULL_NAME
    value: "dpn-keycloak"

  - name: POSTGRES_FULL_NAME
    value: "dpn-keycloak-postgres"

  - name: PARAMETERS_FILE
    value: ".pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.dpnCluster }}.json"

  - name: TARGET_REVISION
    value: "${{ parameters.revision }}"

  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-devtest
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

# =============================================================================
# Stage 1 — Guard (pdev/ptest/puat only have one DPN; dpn02 is disabled)
# =============================================================================
stages:
- stage: GuardSingleDpn
  displayName: "Guard — Single DPN Environments"
  jobs:
  - job: Block
    pool:
      name: "<<YOUR AGENT POOL>>"
    steps:
    - script: |
        ENV="${{ parameters.environment }}"
        CLUSTER="${{ parameters.dpnCluster }}"
        if printf '%s' "$ENV" | grep -qE '^(pdev|ptest|puat)$' && [ "$CLUSTER" = "dpn02" ]; then
          echo "##[error]dpn02 is disabled for environment '$ENV' — it has only a single DPN."
          exit 1
        fi

        REV="${{ parameters.revision }}"
        if ! printf '%s' "$REV" | grep -Eq '^[0-9]+$'; then
          echo "##[error]revision '$REV' is not a non-negative integer. Use 0 for the previous stable release or a revision number from 'helm history'."
          exit 1
        fi

        echo "Guard passed: environment '$ENV' with cluster '$CLUSTER' and revision '$REV' is a valid combination."
      displayName: "Validate DPN cluster and revision"

# =============================================================================
# Stage 2 — Approval Gate
# =============================================================================
- stage: Approval
  displayName: "Approval Gate"
  dependsOn: GuardSingleDpn
  condition: succeeded()

  jobs:
  - deployment: ApprovalJob
    displayName: "Approve Keycloak Rollback"
    environment: "$(APPROVAL_GROUP)"
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "=========================================="
              echo " APPROVAL REQUIRED BEFORE KEYCLOAK ROLLBACK"
              echo "=========================================="
              echo "Environment : ${{ parameters.environment }}"
              echo "Cluster     : ${{ parameters.dpnCluster }}"
              echo "Release     : $(RELEASE_NAME)"
              echo "Revision    : ${{ parameters.revision }} (0 = previous stable release)"
              echo "=========================================="

# =============================================================================
# Stage 3 — Rollback
# =============================================================================
- stage: Rollback
  displayName: "Rollback Keycloak [${{ parameters.environment }}-${{ parameters.dpnCluster }}]"
  dependsOn:
  - GuardSingleDpn
  - Approval
  condition: succeeded()

  jobs:
  - deployment: RollbackKeycloak
    displayName: "Helm Rollback"
    pool:
      name: "<<YOUR AGENT POOL>>"
    environment: "$(APPROVAL_GROUP)"

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
                value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")
                echo "##vso[task.setvariable variable=$param]$value"
              done
            displayName: "Load Environment Config"

          - task: AzureCLI@2
            displayName: "AKS Auth"
            inputs:
              azureSubscription: "${{ parameters.ServiceConnection }}"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                which kubelogin >/dev/null 2>&1 || az aks install-cli --client-version v1.31.0 --kubelogin-version v0.1.4
                kubelogin --version >/dev/null
                helm version >/dev/null

                az account set --subscription $(AZURE_SUBSCRIPTION_ID)
                az aks get-credentials \
                  --resource-group $(RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli

          - task: AzureCLI@2
            displayName: "Helm Rollback Keycloak"
            inputs:
              azureSubscription: "${{ parameters.ServiceConnection }}"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                if ! helm status $(RELEASE_NAME) -n $(NAMESPACE) >/dev/null 2>&1; then
                  echo "##[error]Release '$(RELEASE_NAME)' not found in namespace '$(NAMESPACE)'. Nothing to roll back."
                  exit 1
                fi

                echo "=========================================="
                echo " RELEASE HISTORY (before rollback)"
                echo "=========================================="
                helm history $(RELEASE_NAME) -n $(NAMESPACE)

                REVISION_COUNT=$(helm history $(RELEASE_NAME) -n $(NAMESPACE) -o json | jq 'length')
                if [ "$(TARGET_REVISION)" = "0" ] && [ "$REVISION_COUNT" -lt 2 ]; then
                  echo "##[error]Only $REVISION_COUNT revision(s) exist; no previous release to roll back to."
                  exit 1
                fi

                echo "=========================================="
                echo " HELM ROLLBACK"
                echo "=========================================="
                echo "Rolling back release '$(RELEASE_NAME)' in namespace '$(NAMESPACE)' to revision '$(TARGET_REVISION)' (0 = previous stable release)"

                helm rollback $(RELEASE_NAME) $(TARGET_REVISION) \
                  -n $(NAMESPACE) \
                  --wait \
                  --timeout 10m

                echo "Helm rollback OK"

                echo "=========================================="
                echo " ROLLOUT STATUS"
                echo "=========================================="
                kubectl rollout status deployment/$(POSTGRES_FULL_NAME) \
                  -n $(NAMESPACE) --timeout=300s
                kubectl rollout status statefulset/$(KEYCLOAK_FULL_NAME) \
                  -n $(NAMESPACE) --timeout=600s

                echo "=========================================="
                echo " POST-ROLLBACK STATUS"
                echo "=========================================="
                kubectl get pods -n $(NAMESPACE) -l app=$(KEYCLOAK_FULL_NAME) -o wide
                kubectl get pods -n $(NAMESPACE) -l app=$(POSTGRES_FULL_NAME) -o wide
                kubectl get svc  -n $(NAMESPACE) -l app.kubernetes.io/name=$(KEYCLOAK_FULL_NAME)

                echo "=========================================="
                echo " RELEASE HISTORY (after rollback)"
                echo "=========================================="
                helm history $(RELEASE_NAME) -n $(NAMESPACE)

                echo "Rollback complete."
