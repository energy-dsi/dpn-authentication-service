apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keycloak.secretProviderClassName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"
    keyvaultName: "{{ .Values.keyvault.name }}"
    tenantId: "{{ .Values.keyvault.tenantId }}"

    objects: |
      array:
        - |
          objectName: {{ .Values.keyvault.secrets.dbPassword }}
          objectType: secret
        - |
          objectName: {{ .Values.keyvault.secrets.adminPassword }}
          objectType: secret
        - |
          objectName: {{ .Values.keyvault.secrets.serviceClientSecret }}
          objectType: secret

  # KC_HTTPS_KEY_STORE_PASSWORD / KC_HTTPS_TRUST_STORE_PASSWORD used to be
  # pulled here too, duplicating Key Vault values dpn-tls-cd already
  # publishes. They now come from the shared tls-auth-secret (created once
  # by dpn-tls-cd) via explicit env: entries in keycloak-deployment.yaml.
  secretObjects:
    - secretName: {{ include "keycloak.name" . }}-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.keyvault.secrets.dbPassword }}
          key: KC_DB_PASSWORD
        - objectName: {{ .Values.keyvault.secrets.adminPassword }}
          key: KEYCLOAK_ADMIN_PASSWORD
        - objectName: {{ .Values.keyvault.secrets.serviceClientSecret }}
          key: KC_SERVICE_CLIENT_SECRET
