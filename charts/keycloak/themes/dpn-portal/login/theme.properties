# DPN Portal login theme.
#
# Extends the built-in keycloak.v2 theme (Keycloak's PatternFly-v5-based
# default since 24.x) rather than replacing any .ftl templates — every login
# flow (password reset, OTP, WebAuthn, ...) keeps working unmodified, and
# only appearance changes. `styles` re-declares the parent's own stylesheet
# list plus this theme's override on top, since a child theme's
# theme.properties REPLACES rather than merges the parent's value for a key
# it redeclares.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/dpn-portal.css
