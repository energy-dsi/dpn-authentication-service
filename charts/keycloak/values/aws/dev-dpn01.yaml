# =============================================================================
# Keycloak — AWS dev-dpn01 values
# EKS     : <<your specific value>>
# Account : <<your specific value>>
# Region  : eu-west-2
#
# Content mirrors ../test-dpn01.yaml (deterministic substitution of
# account/cluster/prefix identifiers only) — see that file for the
# confirmed-working AWS pattern this is derived from.
#
# Secrets Manager: the chart reads exactly three objects, set by hand under
# secretsManager.secretPrefix - KC_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD and
# KC_SERVICE_CLIENT_SECRET (the same value the oauth2-proxy sidecars use for
# dpn-service-client). The IAM role dpn-keycloak-secrets-role (see
# serviceAccount below) must be allowed to read them.
#
# KC_HTTPS_KEY_STORE_PASSWORD / KC_HTTPS_TRUST_STORE_PASSWORD are NOT read from
# Secrets Manager. The Keycloak pod takes them from the shared tls-auth-secret
# (KEYSTORE_PASSWORD / TRUSTSTORE_PASSWORD) in this namespace, created by the TLS
# prerequisite workflow, so they always match dpn-tls's keystore.jks/truststore.jks.
# =============================================================================

cloudProvider: aws

namespace: ns-dpn-01

imagePullSecret: ghcr-pull-secret

image:
  repository: <<your specific value>>/keycloak

postgres:
  image:
    repository: <<your specific value>>/postgres
  persistence:
    storageClassName: gp3

config:
  # Pinned to the public LB hostname, matching AWS test-dpn01's fix: with
  # KC_HOSTNAME="" (dynamic), Keycloak stamps every URL in its OIDC discovery
  # document -- including authorization_endpoint -- from whichever hostname
  # the CALLING request used. Airflow's own OIDC discovery call is made
  # server-to-server (internal hostname), so authorization_endpoint came back
  # internal too and broke the browser-facing login redirect with
  # DNS_PROBE_FINISHED_NXDOMAIN. Pinning here makes every discovery response
  # consistently advertise the public hostname regardless of caller.
  KC_HOSTNAME: "dpn-keycloak.ns-dpn-01.svc.cluster.local"
  KC_HOSTNAME_STRICT: "false"

service:
  loadBalancer:
    enabled: true
    loadBalancerIP: <<your specific value>>

serviceAccount:
  create: true
  automountServiceAccountToken: true   # required for IRSA
  annotations:
    eks.amazonaws.com/role-arn: "<<your specific value>>"

secretsManager:
  enabled: true
  secretPrefix: "dpn/dev-dpn01/keycloak"

persistence:
  storageClass: gp3
